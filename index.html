<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ArTermo — Propriedades Termofísicas</title>
    <meta name="description" content="Consulta, interpolação e comparação de propriedades termofísicas de gases e fluidos (Ar, Água a 1 atm…) a partir de tabelas de referência embutidas. Funciona offline." />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#162029" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ArTermo" />
    <script>
      // Aplica o tema salvo antes da primeira pintura (evita piscar).
      try {
        var t = localStorage.getItem('artermo-theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>O ArTermo precisa de JavaScript ativado.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
